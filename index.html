<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>TajStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0d10; --s1:#12151a; --s2:#181c22; --s3:#1f242c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#e9ebee; --mut:#8b929c; --dim:#5d646e;
  --ac:#c9a66b; --ac2:#e3c895; --acd:rgba(201,166,107,.12);
  --ok:#5fb88a; --warn:#d9a24a; --err:#d86a6a;
  --r:16px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe))}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
p{margin:0}
.sub{color:var(--mut);font-size:14px;line-height:1.5;margin-top:6px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.title{font-weight:600;font-size:15px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;margin-top:16px;
  background:radial-gradient(120% 140% at 0% 0%,#2a2418 0%,#14171c 55%,#101317 100%);border:1px solid rgba(201,166,107,.22)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,166,107,.22),transparent 65%)}
.hero .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac2)}
.hero h1{margin-top:8px;font-size:26px;line-height:1.15}
.hero .sub{max-width:92%}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:50px;padding:0 20px;border-radius:14px;color:var(--tx);background:var(--s3);border:1px solid var(--line2);transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.975)}
.btn.pri{color:#1a1409;border:0;background:linear-gradient(180deg,#e3c895,#c9a66b);box-shadow:0 8px 24px -10px rgba(201,166,107,.55)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{height:40px;font-size:13.5px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--mut)}

/* quick actions */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--tx);font:inherit}
.tile:active{background:var(--s2)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--acd);color:var(--ac2);border:1px solid rgba(201,166,107,.2)}
.ico.neutral{background:var(--s2);color:var(--mut);border-color:var(--line)}

/* tabs bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + var(--safe));
  background:rgba(11,13,16,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;color:var(--dim);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:12px;cursor:pointer}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--ac2)}
.tab.on .ic{filter:drop-shadow(0 0 8px rgba(201,166,107,.45))}

/* stepper */
.steps{display:flex;gap:6px;margin:18px 0 6px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--s3)}
.steps i.on{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.stephead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.stephead b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac2);font-weight:600}

/* form */
textarea,input[type=text],select{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:12px;color:var(--tx);font:inherit;font-size:15px;padding:13px 14px;outline:none;transition:border-color .2s}
textarea:focus,input:focus,select:focus{border-color:rgba(201,166,107,.55)}
textarea{min-height:230px;resize:vertical;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:rgba(95,184,138,.3);background:rgba(95,184,138,.08)}
.chip.warn{color:var(--warn);border-color:rgba(217,162,74,.3);background:rgba(217,162,74,.08)}
.chip.err{color:var(--err);border-color:rgba(216,106,106,.3);background:rgba(216,106,106,.08)}
.chip.ac{color:var(--ac2);border-color:rgba(201,166,107,.3);background:var(--acd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* style cards */
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sty{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;color:var(--tx);font:inherit;padding:0}
.sty .th{height:96px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.sty .th .ic{width:30px;height:30px;stroke-width:1.4}
.sty .tt{padding:11px 13px 13px}
.sty .tt b{display:block;font-size:14px}
.sty .tt span{font-size:12px;color:var(--mut)}
.sty.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.sty .ck{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#1a1409;display:none;place-items:center}
.sty .ck .ic{width:14px;height:14px;stroke-width:2.4}
.sty.on .ck{display:grid}
.s0{background:linear-gradient(135deg,#7a5a2c,#d6b06a)}
.s1g{background:linear-gradient(135deg,#1f3a4d,#4f86a6)}
.s2g{background:linear-gradient(135deg,#3c4a3a,#9bb08a)}
.s3g{background:linear-gradient(135deg,#17171b,#4a4a55)}
.s4g{background:linear-gradient(135deg,#4a2a35,#b9697f)}

/* segmented */
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13.5px;font-weight:500;height:38px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 1px 0 var(--line2) inset}

.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}
.switch.on{background:var(--acd);border-color:rgba(201,166,107,.5)}
.switch.on::after{left:21px;background:var(--ac2)}

/* lists */
.item{display:flex;align-items:center;gap:13px;padding:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.item+.item{margin-top:8px}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--ac2);background:linear-gradient(135deg,#2a2418,#171a1f);border:1px solid rgba(201,166,107,.25);flex:none}
.bar{height:5px;border-radius:5px;background:var(--s3);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s linear}
.empty{text-align:center;padding:34px 20px;color:var(--mut);font-size:14px;line-height:1.5}
.empty .ico{margin:0 auto 14px}

/* sheet */
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  background:var(--s1);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + var(--safe));max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 16px}
.stp{display:flex;gap:14px;padding:12px 0}
.stp+.stp{border-top:1px solid var(--line)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ac2);background:var(--acd);border:1px solid rgba(201,166,107,.25);flex:none}

.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--s3);border:1px solid var(--line2);color:var(--tx);
  padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{position:sticky;bottom:calc(76px + var(--safe));margin-top:18px}
.sumrow{display:flex;justify-content:space-between;padding:11px 0;font-size:14px}
.sumrow+.sumrow{border-top:1px solid var(--line)}
.sumrow span:first-child{color:var(--mut)}
.view{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* загрузка персонажей, голоса */
.btn.danger{color:var(--err)}
.thumb{width:46px;height:46px;border-radius:14px;object-fit:contain;background:linear-gradient(135deg,#2a2418,#171a1f);border:1px solid rgba(201,166,107,.25);flex:none;cursor:pointer}
.av[data-act]{cursor:pointer}
.prev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:170px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--mut);font-size:14px;text-align:center;padding:14px;cursor:pointer;overflow:hidden;background:var(--s2)}
.prev .ic{width:28px;height:28px}
.prev img{max-width:100%;max-height:280px;border-radius:10px;display:block}
.vrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:none;border:0;border-top:1px solid var(--line);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.vrow:first-child{border-top:0}
.vrow .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;color:#1a1409}
.vrow.on .dot{border-color:var(--ac);background:var(--ac)}
.vrow .dot .ic{width:13px;height:13px;stroke-width:2.6;display:none}
.vrow.on .dot .ic{display:block}
.err-note{color:var(--err);font-size:12.5px;line-height:1.45}
#app.noanim .view{animation:none}
</style>
</head>

<main class="wrap" id="app"></main>

<nav class="tabbar"><div class="in" id="tabs"></div></nav>

<div class="toast" id="toast"></div>

<script>
/* ───────────── НАСТРОЙКИ ───────────── */
const CONFIG = {
  API_BASE: "",          // пусто = Mini App открыт с того же адреса, где работает бот (Bothost). Иначе: "https://ваш-домен"
  BILLING: false,        // true — показывать баланс/стоимость (списание в боте пока не реализовано)
  PRICE_PER_MIN: 90,
  STYLE_IMAGES: {}       // {"classic":"https://.../1.jpg", ...} — свои картинки-образцы стилей
};
// Скрытый промпт: пользователь его не видит, только копирует кнопкой
const HIDDEN_PROMPT = "Нарисуй этого человека как 2D-персонажа в стиле классической студии Дисней. Сделай лист-спрайты на однотонном зелёном фоне: полный рост спереди с опущенными руками, 9 выражений лица (нейтральное, улыбка, смех, злость, удивление, грусть, мысль, подмигивание, крик) ровной сеткой, отдельно рты для озвучки (закрытый, А, О, У, Е, М, Ф) и глаза. Чёткий контур, высокое разрешение, PNG.";

const STYLES = [
  {id:"classic",  n:"Классика",   d:"Мягкий контур, тёплая палитра", g:"s0",  i:"i-film"},
  {id:"modern",   n:"Современный",d:"Объёмный свет, глубокий цвет",  g:"s1g", i:"i-layers"},
  {id:"water",    n:"Акварель",   d:"Книжная иллюстрация",           g:"s2g", i:"i-palette"},
  {id:"noir",     n:"Нуар",       d:"Контраст, графика, тени",       g:"s3g", i:"i-eye"},
  {id:"rose",     n:"Постер",     d:"Плоские цвета, плотный контур", g:"s4g", i:"i-spark"}
];
const ENGINES = {piper:"Piper", eleven:"ElevenLabs"};

/* ───────────── TELEGRAM ───────────── */
const tg = window.Telegram && Telegram.WebApp;
const inTG = !!(tg && tg.initData);

/* ───────────── API ───────────── */
async function api(path, o={}){
  const h = {"X-Init-Data": inTG ? tg.initData : ""};
  let body = o.body;
  if (o.json){ h["Content-Type"]="application/json"; body=JSON.stringify(o.json); }
  let r;
  try{ r = await fetch(CONFIG.API_BASE+path, {method:o.method||(body?"POST":"GET"), headers:h, body}); }
  catch(e){ throw new Error("Нет связи с сервером"); }
  if (o.raw){
    if (!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||("Ошибка "+r.status)); }
    return r;
  }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error||("Ошибка "+r.status));
  return d;
}
function upload(path, fd, onp){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest(); x.open("POST", CONFIG.API_BASE+path);
    x.setRequestHeader("X-Init-Data", tg.initData);
    x.upload.onprogress=e=>{ if(e.lengthComputable) onp(e.loaded/e.total) };
    x.onload=()=>{ let d={}; try{d=JSON.parse(x.responseText)}catch(_){}; x.status<300?res(d):rej(new Error(d.error||("Ошибка "+x.status))) };
    x.onerror=()=>rej(new Error("Нет связи с сервером"));
    x.send(fd);
  });
}

function applyMe(d){
  const pp=Object.fromEntries(S.projects.map(p=>[p.id,p.status])), pc=Object.fromEntries(S.chars.map(c=>[c.name,c.status]));
  isAdmin=!!d.admin; S.chars=d.characters; S.lib=d.library; S.projects=d.projects;
  S.settings=d.settings; S.tts=d.tts; S.profile=d.profile;
  if (S.loaded){
    for (const p of S.projects){
      const was=pp[p.id];
      if ((was==="queued"||was==="rendering") && p.status==="done"){ toast("✅ «"+p.title+"» готов — нажмите «Скачать»"); hapticOk(); }
      if ((was==="queued"||was==="rendering") && p.status==="error") toast("Рендер не удался");
    }
    for (const c of S.chars){
      if (pc[c.name]==="processing" && c.status==="ready"){
        toast("✅ Персонаж «"+c.name+"» создан"); hapticOk();
        delete thumbs["M:"+c.name]; delete thumbs["L:"+c.name];
      }
    }
  }
  S.loaded=true;
}

const $ = s => document.querySelector(s);
const ic = (n,c="") => `<svg class="ic ${c}"><use href="#${n}"/></svg>`;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2600) }
function fmt(sec){ sec=Math.max(0,sec|0); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0") }
const cleanName = s => s.replace(/[.$#\[\]\/\\:\n\r\t]/g," ").replace(/\s+/g," ").trim().slice(0,30);

/* превью персонажей: картинка запрашивается с подписью Telegram и кэшируется как blob */
const thumbs={};
function thumbSrc(name, lib){
  const k=(lib?"L:":"M:")+name, v=thumbs[k];
  if (v && v!=="loading" && v!=="none") return v;
  if (!v && !demo){
    thumbs[k]="loading";
    api("/api/character/thumb?name="+encodeURIComponent(name)+(lib?"&lib=1":""), {raw:true})
      .then(r=>r.blob()).then(b=>{ thumbs[k]=URL.createObjectURL(b); sig=""; softDraw(); })
      .catch(()=>{ thumbs[k]="none" });
  }
  return "";
}

function parseScript(text){
  const scenes=[]; let cur=null;
  for(const raw of text.split("\n")){
    const line=raw.trim(); if(!line) continue;
    let m=line.match(/^\[?\s*сцена\s*[:\-–]\s*(.+?)\]?$/i);
    if(m){ cur={setting:m[1],lines:[]}; scenes.push(cur); continue }
    m=line.match(/^([^:]{1,30}):\s*(?:\(([^)]*)\))?\s*(.+)$/);
    if(m){ if(!cur){cur={setting:"студия",lines:[]}; scenes.push(cur)} cur.lines.push({who:m[1].trim(),emotion:(m[2]||"neutral").trim(),text:m[3].trim()}) }
  }
  return scenes;
}
function analyse(){
  const sc=parseScript(S.script), lines=sc.flatMap(s=>s.lines);
  const words=lines.reduce((a,l)=>a+l.text.split(/\s+/).length,0);
  const dur=Math.round(words/2.6 + lines.length*0.4);
  const who=[...new Set(lines.map(l=>l.who))];
  const known=new Set([...S.chars.filter(c=>c.status==="ready"),...S.lib].map(c=>c.name.toLowerCase()));
  return {scenes:sc.length, lines:lines.length, who, missing:who.filter(w=>!known.has(w.toLowerCase())), dur, cost:Math.max(1,Math.ceil(dur/60*CONFIG.PRICE_PER_MIN))};
}

const engineOf = key => (key||"").split(":")[0];
function voiceName(key){
  if (!key) return "По умолчанию";
  const [e,id]=[engineOf(key), key.slice(key.indexOf(":")+1)];
  const v=((V[e]&&V[e].voices)||[]).find(v=>v.key===key);
  return (v?v.name:(id||"По умолчанию"))+" · "+(ENGINES[e]||e);
}
const findChar = n => S.chars.find(c=>c.name.toLowerCase()===n.toLowerCase());
function speakerVoice(w){      // голос реплик персонажа для выбранного способа озвучки
  const c=findChar(w), key=S.voices[w]||(c&&c.voice)||"";
  return engineOf(key)===S.engine ? key : "";
}
async function loadVoices(engine){
  if (demo) { V[engine]={ok:false,error:DEMO_MSG,voices:[]}; return; }
  try{ V[engine]=await api("/api/voices?engine="+engine); }
  catch(e){ V[engine]={ok:false,error:e.message,voices:[]}; }
}

let VS=null, audio=null; const sampleCache={};
function curVoiceKey(t){
  if (t.type==="default") return S.settings.voice;
  if (t.type==="char"){ const c=findChar(t.name); return c?c.voice:""; }
  return speakerVoice(t.name);
}
async function openVoices(target, fixedEngine){
  VS={target, engine:fixedEngine||S.settings.engine, fixed:!!fixedEngine, sel:curVoiceKey(target), playing:"", err:""};
  drawVoices();
  if (!V[VS.engine]) { await loadVoices(VS.engine); drawVoices(); }
}
function drawVoices(){
  if (!VS) return;
  const c=V[VS.engine], t=VS.target;
  const title = t.type==="default" ? "Озвучка по умолчанию" : "Голос: "+esc(t.name);
  let list;
  if (!c) list=`<div class="empty">Загружаю голоса…</div>`;
  else if (!c.ok) list=`<div class="empty">${esc(c.error||"Голоса недоступны")}</div>`;
  else if (!c.voices.length) list=`<div class="empty">В аккаунте нет голосов.</div>`;
  else list=c.voices.map(v=>`<button class="vrow ${VS.sel===v.key?"on":""}" data-act="vpick" data-key="${esc(v.key)}">
      <span class="dot">${ic("i-check")}</span>
      <span class="grow"><div class="title ellip">${esc(v.name)}</div><div class="xs mut">${esc(v.desc||"")}${v.ready===false?" · скачается при первом запуске":""}</div></span>
      ${VS.playing===v.key?`<span class="chip ac">${ic("i-wave")}Озвучиваю…</span>`:`<span class="iconbtn" style="width:36px;height:36px">${ic("i-play","fill")}</span>`}
    </button>`).join("");
  const st=$("#sheet").scrollTop;
  sheet(`<h1 style="font-size:20px">${title}</h1>
    <p class="sub">Нажмите на голос — он выберется и сразу озвучит пример выбранной моделью.</p>
    ${VS.fixed?"":`<div class="seg" style="margin-top:14px">${Object.entries(ENGINES).map(([k,n])=>`<button class="${VS.engine===k?"on":""}" data-act="veng:${k}">${n}</button>`).join("")}</div>`}
    ${VS.err?`<div class="err-note" style="margin-top:10px">${esc(VS.err)}</div>`:""}
    <div style="margin-top:10px">${list}</div>
    <button class="btn pri block" style="margin-top:14px" data-act="closesheet">Готово</button>`);
  $("#sheet").scrollTop=st;
}
async function playSample(key){
  if (demo) return toast(DEMO_MSG);
  VS.playing=key; VS.err=""; drawVoices();
  try{
    if (!sampleCache[key]){
      const r=await api("/api/tts/sample",{json:{voice:key},raw:true});
      sampleCache[key]=URL.createObjectURL(await r.blob());
    }
    if (audio) audio.pause();
    audio=new Audio(sampleCache[key]); await audio.play();
  }catch(e){ if(VS) VS.err=e.message; }
  if (VS) { VS.playing=""; drawVoices(); }
}
async function pickVoice(key){
  VS.sel=key; drawVoices();
  const t=VS.target, e=engineOf(key);
  try{
    if (t.type==="default"){ S.settings=await api("/api/settings",{json:{engine:e,voice:key}}); }
    else {
      const c=findChar(t.name);
      if (t.type==="speaker") S.voices[t.name]=key;
      if (c){ c.voice=key; if(!demo) await api("/api/character/voice",{json:{name:c.name,voice:key}}); }
    }
  }catch(err){ VS.err=err.message; }
  playSample(key);
}

function charItem(c, lib){

  let right, extra="", sub="";
  if (c.status==="processing"){
    right=`<span class="chip ac">${Math.round(c.pct)}%</span>`;
    extra=`<div class="bar" style="width:100%"><i style="width:${Math.max(3,c.pct)}%"></i></div><div class="xs mut" style="width:100%">${esc(c.text||"Обрабатываю…")}</div>`;
  } else if (c.status==="error"){
    right=`<span class="chip err">Ошибка</span>`;
    extra=`<div class="err-note" style="width:100%">${esc(c.error)}</div>`;
  } else right=`<span class="chip ok">Готов</span>`;
  if (!lib) sub = `<div class="xs mut ellip" style="margin-top:3px">${ic("i-mic").replace('class="ic "','class="ic" style="width:12px;height:12px;vertical-align:-2px;margin-right:4px"')}${esc(voiceName(c.voice))}</div>`;
  const canDel = !lib || isAdmin;
  return `<div class="item" style="flex-wrap:wrap">${av}
    <div class="grow"><div class="title ellip">${esc(c.name)}</div>${sub}</div>${right}
    ${c.status!=="processing"?`<div class="row" style="width:100%;gap:8px;justify-content:flex-end">
      ${!lib&&c.status==="ready"?`<button class="btn sm ghost" data-act="charvoice" data-name="${esc(c.name)}">${ic("i-mic")}Голос</button>`:""}
      ${canDel?`<button class="btn sm ghost danger" data-act="delchar" data-name="${esc(c.name)}" data-lib="${lib?1:0}">${ic("i-trash")}${c.status==="error"?"Убрать":"Удалить"}</button>`:""}
    </div>`:""}
    ${extra}</div>`;
}
function viewChars(){
  const lib=S.libTab==="lib", list=lib?S.lib:S.chars;
  return `<div class="view">
    <div class="row"><div class="grow"><h1>Персонажи</h1><p class="sub">Герои ваших мультфильмов</p></div><button class="iconbtn" data-act="addchar" style="color:var(--ac2)" aria-label="Добавить">${ic("i-plus")}</button></div>
    <div class="seg" style="margin-top:18px"><button class="${!lib?"on":""}" data-act="lib:mine">Мои · ${S.chars.length}</button><button class="${lib?"on":""}" data-act="lib:lib">Библиотека · ${S.lib.length}</button></div>
    <div style="margin-top:14px">${list.length?list.map(c=>charItem(lib?{...c,status:"ready",pct:100}:c, lib)).join("")
      :`<div class="card empty"><div class="ico">${ic("i-users")}</div>Пока нет персонажей.<br>Добавьте первого — это займёт пару минут.<br><button class="btn pri sm" style="margin-top:16px" data-act="addchar">${ic("i-plus")}Добавить</button></div>`}</div>
    ${isAdmin&&lib?`<button class="btn block" style="margin-top:12px" data-act="addchar">${ic("i-lib")}Добавить в библиотеку</button>`:""}
  </div>`;
}

function projItem(p){
  const act=p.status==="rendering"||p.status==="queued", pct=Math.round(p.pct||0);
  const meta=(p.mode==="preview"?"Предпросмотр":"Полный рендер")+(p.dur?" · "+fmt(p.dur):"");
  let right;
  if (act) right=`<span class="chip ac">${p.status==="queued"?"Очередь":pct+"%"}</span>`;
  else if (p.status==="error") right=`<span class="chip err">Ошибка</span>`;
  else right=`<button class="btn sm pri" data-act="dl:${p.id}" ${S.sending[p.id]?"disabled":""}>${ic("i-download")}${S.sending[p.id]?"Отправляю…":"Скачать"}</button>`;
  return `<div class="item" style="flex-wrap:wrap" data-pid="${p.id}">
    <div class="ico ${act?"":"neutral"}">${ic(act?"i-clock":(p.status==="error"?"i-shield":"i-film"))}</div>
    <div class="grow"><div class="title ellip">${esc(p.title)}</div><div class="xs mut" style="margin-top:3px">${meta}${act&&p.text?" · "+esc(p.text):""}</div></div>
    ${right}
    ${act?`<div class="bar" style="width:100%"><i style="width:${Math.max(3,pct)}%"></i></div>`:""}
    ${p.status==="error"&&p.error?`<div class="err-note" style="width:100%">${esc(p.error)}</div>`:""}
    ${p.status==="done"?`<div class="xs mut" style="width:100%">Готово — нажмите «Скачать», видео придёт в чат с ботом</div>`:""}
  </div>`;
}
function viewProjects(){
  return `<div class="view"><h1>Проекты</h1><p class="sub">Статус рендера и готовые видео</p>
    <div style="margin-top:18px">${S.projects.length?S.projects.map(projItem).join(""):`<div class="card empty"><div class="ico">${ic("i-folder")}</div>Проектов пока нет.</div>`}</div></div>`;
}

function viewProfile(){
  const p=S.profile, name=[user.first_name,user.last_name].filter(Boolean).join(" ")||"Гость";
  return `<div class="view">
    <div class="row" style="margin-top:4px">${user.photo_url?`<img src="${esc(user.photo_url)}" style="width:60px;height:60px;border-radius:18px;object-fit:cover;border:1px solid var(--line2)">`:`<div class="av" style="width:60px;height:60px;font-size:22px;border-radius:18px">${esc(name[0]).toUpperCase()}</div>`}
      <div class="grow"><h1 style="font-size:21px" class="ellip">${esc(name)}</h1><div class="sm mut" style="margin-top:3px">${user.username?"@"+esc(user.username):"ID "+user.id}</div></div></div>
    <div class="hero" style="margin-top:20px"><div class="row"><div class="grow"><div class="tag">Подписка</div><h1 style="font-size:22px;margin-top:6px">${esc(p.plan)}</h1><p class="sub" style="margin-top:4px">${esc(p.until)}</p></div><div class="ico" style="width:52px;height:52px;border-radius:16px;z-index:1">${ic("i-crown")}</div></div>
      <button class="btn sm" style="margin-top:16px;position:relative;z-index:1" data-act="plan">Управление подпиской</button></div>
    <div class="grid2" style="margin-top:10px">${CONFIG.BILLING?`<div class="card"><div class="xs mut">Баланс</div><div class="title" style="font-size:22px;margin-top:6px">${p.balance.toLocaleString("ru")} ₽</div></div>`:`<div class="card"><div class="xs mut">Озвучка</div><div class="title ellip" style="font-size:17px;margin-top:8px">${ENGINES[S.settings.engine]}</div></div>`}<div class="card" style="margin-top:0"><div class="xs mut">Мультфильмов</div><div class="title" style="font-size:22px;margin-top:6px">${p.films}</div></div></div>
    <h2>Аккаунт</h2>
    ${[["i-mic","Озвучка по умолчанию","defvoice"],...(CONFIG.BILLING?[["i-wallet","Пополнить баланс","topup"]]:[]),["i-shield","Условия и конфиденциальность","terms"],["i-user","Поддержка","support"]].map(r=>`<button class="item" style="width:100%;color:var(--tx);font:inherit;cursor:pointer;text-align:left" data-act="${r[2]}"><div class="ico neutral" style="width:38px;height:38px">${ic(r[0])}</div><div class="grow title" style="font-weight:500">${r[1]}</div>${ic("i-chev").replace('class="ic "','class="ic" style="color:var(--dim)"')}</button>`).join("")}
    ${demo?`<p class="xs mut" style="text-align:center;margin-top:20px;line-height:1.5">Демо-режим: приложение открыто вне Telegram. Откройте его кнопкой TajStudio в боте — там будут ваши данные.</p>`:""}
  </div>`;
}

/* ───────────── РЕНДЕР ЭКРАНА ───────────── */
const TABS=[["home","i-film","Студия"],["chars","i-users","Персонажи"],["projects","i-folder","Проекты"],["profile","i-user","Профиль"]];
function draw(anim=true){
  $("#tabs").innerHTML=TABS.map(([k,i,t])=>`<button class="tab ${S.tab===k&&!S.flowOpen?"on":""}" data-act="tab:${k}">${ic(i)}<span>${t}</span></button>`).join("");
  $("#app").classList.toggle("noanim", !anim);
  $("#app").innerHTML = S.flowOpen?viewFlow():({home:viewHome,chars:viewChars,projects:viewProjects,profile:viewProfile})[S.tab]();
  sig=JSON.stringify([S.chars,S.lib,S.projects,S.settings,S.tts]);
  bind();
}
function bind(){
  const sc=$("#script");
  if(sc) sc.oninput=()=>{ S.script=sc.value; const a=analyse();
    $("#st-sc").textContent=a.scenes; $("#st-ln").textContent=a.lines; $("#st-du").textContent=fmt(a.dur); $("#who").innerHTML=whoChips(a);
    const nb=$("#nextbtn"); if(nb) nb.disabled=!a.lines; };
}

/* ───────────── ДЕЙСТВИЯ ───────────── */
function sheet(html){ $("#sheet").innerHTML=`<div class="grab"></div>${html}`; $("#sheet").classList.add("on"); $("#veil").classList.add("on") }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#veil").classList.remove("on"); if(audio) audio.pause(); VS=null; UP=null; }
$("#veil").onclick=closeSheet;

let UP=null;
function addCharSheet(){
  const toLib=isAdmin&&S.libTab==="lib";
  UP={file:null, url:"", lib:toLib};
  sheet(`<h1 style="font-size:20px">Новый персонаж</h1><p class="sub">Выберите лист из ChatGPT, задайте имя и проверьте превью.</p>
    <div class="card" style="margin-top:14px">
      <label class="prev" for="cfile" id="prev">${ic("i-upload")}<span>Выбрать файл (PNG / JPG)</span></label>
      <input type="file" id="cfile" accept="image/*" hidden>
      <div class="xs mut ellip" id="fname" style="margin-top:8px"></div>
      <div class="xs mut" style="margin:14px 0 6px">Имя персонажа — как в сценарии</div>
      <input type="text" id="cname" maxlength="30" placeholder="Например: Маша" autocomplete="off">
      ${toLib?`<div class="row" style="margin-top:14px"><div class="grow sm">Добавить в библиотеку</div><div class="switch on" id="libsw"></div></div>`:""}
      <div class="bar" id="upbar" style="display:none"><i style="width:0"></i></div>
      <div class="xs mut" id="uptxt" style="margin-top:6px;min-height:16px"></div>
    </div>
    <button class="btn pri block" id="upbtn" style="margin-top:14px" disabled>${ic("i-upload")}Загрузить</button>
    <button class="btn block ghost" style="margin-top:8px" data-act="copyprompt">${ic("i-copy")}Скопировать промпт для ChatGPT</button>`);
  const check=()=>{ $("#upbtn").disabled=!(UP&&UP.file&&cleanName($("#cname").value)); };
  $("#cname").oninput=check;
  $("#cfile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    if (f.size>25*1024*1024){ toast("Файл больше 25 МБ"); return; }
    UP.file=f; if(UP.url) URL.revokeObjectURL(UP.url); UP.url=URL.createObjectURL(f);
    $("#prev").innerHTML=`<img src="${UP.url}" alt="">`; $("#fname").textContent=f.name+" · "+(f.size/1048576).toFixed(1)+" МБ"; check();
  };
  const sw=$("#libsw"); if(sw) sw.onclick=()=>{ sw.classList.toggle("on"); UP.lib=sw.classList.contains("on"); };
  $("#upbtn").onclick=doUpload;
}
async function doUpload(){
  if (demo) return toast(DEMO_MSG);
  const name=cleanName($("#cname").value);
  if (!UP.file||!name) return;
  const go=async()=>{
    $("#upbtn").disabled=true; $("#cname").disabled=true; $("#upbar").style.display="block";
    const fd=new FormData(); fd.append("name",name); if(UP.lib) fd.append("library","1"); fd.append("file",UP.file,UP.file.name);
    try{
      await upload("/api/character", fd, f=>{ $("#upbar i").style.width=Math.round(f*100)+"%"; $("#uptxt").textContent="Загрузка файла "+Math.round(f*100)+"%"; });
      const lib=UP.lib; closeSheet(); S.tab="chars"; S.libTab=lib?"lib":"mine"; S.flowOpen=false;
      toast("Создаю персонажа «"+name+"»…"); hapticOk(); draw(); poll();
    }catch(e){ toast(e.message); $("#upbtn").disabled=false; $("#cname").disabled=false; $("#uptxt").textContent=e.message; }
  };
  if (!UP.lib && findChar(name)) confirmBox("Персонаж «"+name+"» уже есть. Заменить?", go); else go();
}

function charSheet(name, lib){
  const src=thumbSrc(name,lib), c=findChar(name);
  sheet(`<h1 style="font-size:20px">${esc(name)}</h1>
    <div class="card" style="margin-top:14px;text-align:center">${src?`<img src="${src}" alt="" style="max-width:100%;max-height:340px;object-fit:contain">`:`<div class="empty">Превью нет</div>`}</div>
    ${!lib&&c?`<div class="sm mut" style="margin-top:12px">Голос: ${esc(voiceName(c.voice))}</div>`:""}
    <div class="grid2" style="margin-top:14px">${!lib?`<button class="btn" data-act="charvoice" data-name="${esc(name)}">${ic("i-mic")}Голос</button>`:`<span></span>`}
      <button class="btn" data-act="closesheet">Закрыть</button></div>`);
}

async function launch(mode){
  const a=analyse();
  if(!a.lines) return toast("Добавьте реплики в сценарий");
  if(a.missing.length) return toast("Нет персонажей: "+a.missing.join(", "));
  if(demo) return toast(DEMO_MSG);
  if(S.launching) return;
  const voices=Object.fromEntries(a.who.map(w=>[w,speakerVoice(w)]).filter(([,v])=>v));
  S.launching=true; draw(false); haptic("medium");
  try{
    await api("/api/render",{json:{mode:mode==="preview"?"preview":"render", style:S.style, script:S.script.slice(0,20000), engine:S.engine, voices}});
    S.launching=false; S.flowOpen=false; S.tab="projects";
    toast(mode==="preview"?"Предпросмотр запущен":"Рендер запущен"); hapticOk();
    await refresh(); draw(); poll();
  }catch(e){ S.launching=false; draw(false); toast(e.message); }
}
async function download(id){
  if (demo) return toast(DEMO_MSG);
  if (S.sending[id]) return;
  S.sending[id]=1; draw(false);
  try{ await api("/api/project/send",{json:{id}}); toast("Видео отправлено в чат ✅"); hapticOk(); }
  catch(e){ toast(e.message); }
  delete S.sending[id]; draw(false);
}
function delChar(name, lib){
  confirmBox("Удалить персонажа «"+name+"»? Это нельзя отменить.", async()=>{
    if (demo){ S.chars=S.chars.filter(c=>c.name!==name); return draw(false); }
    try{ await api("/api/character/delete",{json:{name,library:lib}}); delete thumbs["M:"+name]; delete thumbs["L:"+name]; toast("Персонаж удалён"); closeSheet(); await refresh(); draw(false); }
    catch(e){ toast(e.message); }
  });
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const [act,arg]=el.dataset.act.split(":"); haptic("light");
  const nm=el.dataset.name, lib=el.dataset.lib==="1";
  switch(act){
    case "tab": S.tab=arg; S.flowOpen=false; closeSheet(); draw(); scrollTo(0,0); if(arg!=="home") poll(); break;
    case "newfilm": S.flowOpen=true; S.step=0; S.engine=S.settings.engine; draw(); scrollTo(0,0);
      for (const k of Object.keys(ENGINES)) if(!V[k]) loadVoices(k).then(()=>{ if(S.flowOpen&&S.step===2) draw(false) }); break;
    case "flowclose": S.flowOpen=false; draw(); break;
    case "next": if(S.step<3){S.step++; draw(); scrollTo(0,0)} break;
    case "back": if(S.step>0){S.step--; draw(); scrollTo(0,0)} break;
    case "style": S.style=arg; draw(false); break;
    case "engine": S.engine=arg; draw(false); if(!demo) api("/api/settings",{json:{engine:arg,voice:S.settings.engine===arg?S.settings.voice:""}}).then(s=>S.settings=s).catch(()=>{}); break;
    case "speaker": openVoices({type:"speaker",name:nm}, S.engine); break;
    case "charvoice": openVoices({type:"char",name:nm}); break;
    case "defvoice": openVoices({type:"default"}); break;
    case "veng": VS.engine=arg; VS.sel=""; drawVoices(); if(!V[arg]) loadVoices(arg).then(drawVoices); break;
    case "vpick": pickVoice(el.dataset.key); break;
    case "closesheet": { closeSheet(); draw(false); break }
    case "lib": S.libTab=arg; draw(); break;
    case "go": launch(arg); break;
    case "dl": download(arg); break;
    case "addchar": addCharSheet(); break;
    case "charview": charSheet(nm, lib); break;
    case "delchar": delChar(nm, lib); break;
    case "copyprompt": (navigator.clipboard?navigator.clipboard.writeText(HIDDEN_PROMPT):Promise.reject()).then(()=>toast("Промпт скопирован")).catch(()=>{const t=document.createElement("textarea");t.value=HIDDEN_PROMPT;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Промпт скопирован")}catch(_){toast("Не удалось скопировать")}t.remove()}); break;
    case "plan": case "topup": case "terms": case "support":
      toast("Раздел подключается к вашему боту"); break;
  }
});

document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !demo) poll(); });
draw();
if (!demo) poll();
</script>
</body>
</html>
