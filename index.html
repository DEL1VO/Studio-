<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Мульт-студия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0d10; --s1:#12151a; --s2:#181c22; --s3:#1f242c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#e9ebee; --mut:#8b929c; --dim:#5d646e;
  --ac:#c9a66b; --ac2:#e3c895; --acd:rgba(201,166,107,.12);
  --ok:#5fb88a; --warn:#d9a24a; --err:#d86a6a;
  --r:16px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe))}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
p{margin:0}
.sub{color:var(--mut);font-size:14px;line-height:1.5;margin-top:6px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.title{font-weight:600;font-size:15px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;margin-top:16px;
  background:radial-gradient(120% 140% at 0% 0%,#2a2418 0%,#14171c 55%,#101317 100%);border:1px solid rgba(201,166,107,.22)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,166,107,.22),transparent 65%)}
.hero .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac2)}
.hero h1{margin-top:8px;font-size:26px;line-height:1.15}
.hero .sub{max-width:92%}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:50px;padding:0 20px;border-radius:14px;color:var(--tx);background:var(--s3);border:1px solid var(--line2);transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.975)}
.btn.pri{color:#1a1409;border:0;background:linear-gradient(180deg,#e3c895,#c9a66b);box-shadow:0 8px 24px -10px rgba(201,166,107,.55)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{height:40px;font-size:13.5px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--mut)}

/* quick actions */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--tx);font:inherit}
.tile:active{background:var(--s2)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--acd);color:var(--ac2);border:1px solid rgba(201,166,107,.2)}
.ico.neutral{background:var(--s2);color:var(--mut);border-color:var(--line)}

/* tabs bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + var(--safe));
  background:rgba(11,13,16,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;color:var(--dim);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:12px;cursor:pointer}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--ac2)}
.tab.on .ic{filter:drop-shadow(0 0 8px rgba(201,166,107,.45))}

/* stepper */
.steps{display:flex;gap:6px;margin:18px 0 6px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--s3)}
.steps i.on{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.stephead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.stephead b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac2);font-weight:600}

/* form */
textarea,input[type=text],select{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:12px;color:var(--tx);font:inherit;font-size:15px;padding:13px 14px;outline:none;transition:border-color .2s}
textarea:focus,input:focus,select:focus{border-color:rgba(201,166,107,.55)}
textarea{min-height:230px;resize:vertical;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:rgba(95,184,138,.3);background:rgba(95,184,138,.08)}
.chip.warn{color:var(--warn);border-color:rgba(217,162,74,.3);background:rgba(217,162,74,.08)}
.chip.err{color:var(--err);border-color:rgba(216,106,106,.3);background:rgba(216,106,106,.08)}
.chip.ac{color:var(--ac2);border-color:rgba(201,166,107,.3);background:var(--acd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* style cards */
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sty{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;color:var(--tx);font:inherit;padding:0}
.sty .th{height:96px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.sty .th .ic{width:30px;height:30px;stroke-width:1.4}
.sty .tt{padding:11px 13px 13px}
.sty .tt b{display:block;font-size:14px}
.sty .tt span{font-size:12px;color:var(--mut)}
.sty.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.sty .ck{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#1a1409;display:none;place-items:center}
.sty .ck .ic{width:14px;height:14px;stroke-width:2.4}
.sty.on .ck{display:grid}
.s0{background:linear-gradient(135deg,#7a5a2c,#d6b06a)}
.s1g{background:linear-gradient(135deg,#1f3a4d,#4f86a6)}
.s2g{background:linear-gradient(135deg,#3c4a3a,#9bb08a)}
.s3g{background:linear-gradient(135deg,#17171b,#4a4a55)}
.s4g{background:linear-gradient(135deg,#4a2a35,#b9697f)}

/* segmented */
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13.5px;font-weight:500;height:38px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 1px 0 var(--line2) inset}

.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}
.switch.on{background:var(--acd);border-color:rgba(201,166,107,.5)}
.switch.on::after{left:21px;background:var(--ac2)}

/* lists */
.item{display:flex;align-items:center;gap:13px;padding:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.item+.item{margin-top:8px}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--ac2);background:linear-gradient(135deg,#2a2418,#171a1f);border:1px solid rgba(201,166,107,.25);flex:none}
.bar{height:5px;border-radius:5px;background:var(--s3);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s linear}
.empty{text-align:center;padding:34px 20px;color:var(--mut);font-size:14px;line-height:1.5}
.empty .ico{margin:0 auto 14px}

/* sheet */
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  background:var(--s1);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + var(--safe));max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 16px}
.stp{display:flex;gap:14px;padding:12px 0}
.stp+.stp{border-top:1px solid var(--line)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ac2);background:var(--acd);border:1px solid rgba(201,166,107,.25);flex:none}

.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--s3);border:1px solid var(--line2);color:var(--tx);
  padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{position:sticky;bottom:calc(76px + var(--safe));margin-top:18px}
.sumrow{display:flex;justify-content:space-between;padding:11px 0;font-size:14px}
.sumrow+.sumrow{border-top:1px solid var(--line)}
.sumrow span:first-child{color:var(--mut)}
.view{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- иконки -->

<main class="wrap" id="app"></main>

<nav class="tabbar"><div class="in" id="tabs"></div></nav>

<script>
/* ───────────── НАСТРОЙКИ ───────────── */
const CONFIG = {
  FIREBASE_URL: "",              // например https://your-project-default-rtdb.firebaseio.com
  BOT_USERNAME: "",              // без @ — для кнопки «Открыть чат»
  ADMIN_IDS: [],                 // Telegram ID админов (видят раздел «Библиотека»)
  PRICE_PER_MIN: 90,             // стоимость полного рендера за минуту видео, ₽
  VOICES: ["Адам — спокойный", "Алиса — тёплый", "Марк — глубокий", "Ева — лёгкий", "Рассказчик"],
  STYLE_IMAGES: {}               // {"classic":"https://.../1.jpg", ...} — свои картинки-образцы стилей
};
// Скрытый промпт: пользователь его не видит, только копирует кнопкой
const HIDDEN_PROMPT = "Нарисуй этого человека как 2D-персонажа в стиле классической студии Дисней. Сделай лист-спрайты на однотонном зелёном фоне: полный рост спереди с опущенными руками, 9 выражений лица (нейтральное, улыбка, смех, злость, удивление, грусть, мысль, подмигивание, крик) ровной сеткой, отдельно рты для озвучки (закрытый, А, О, У, Е, М, Ф) и глаза. Чёткий контур, высокое разрешение, PNG.";

const STYLES = [
  {id:"classic",  n:"Классика",   d:"Мягкий контур, тёплая палитра", g:"s0",  i:"i-film"},
  {id:"modern",   n:"Современный",d:"Объёмный свет, глубокий цвет",  g:"s1g", i:"i-layers"},
  {id:"water",    n:"Акварель",   d:"Книжная иллюстрация",           g:"s2g", i:"i-palette"},
  {id:"noir",     n:"Нуар",       d:"Контраст, графика, тени",       g:"s3g", i:"i-eye"},
  {id:"rose",     n:"Постер",     d:"Плоские цвета, плотный контур", g:"s4g", i:"i-spark"}
];

/* ───────────── TELEGRAM ───────────── */
const tg = window.Telegram && Telegram.WebApp;
const inTG = !!(tg && tg.initData);
if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#0b0d10"); tg.setBackgroundColor("#0b0d10"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){} }
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {id:0, first_name:"Гость"};
let isAdmin = CONFIG.ADMIN_IDS.includes(user.id);
const haptic = (t="light") => { try{ tg.HapticFeedback.impactOccurred(t) }catch(e){} };

/* ───────────── ДАННЫЕ ───────────── */
const now = () => Math.floor(Date.now()/1000);
const S = {
  tab:"home", step:0, flowOpen:false, libTab:"mine",
  script:"[Сцена: офис, утро]\nАлекс: (спокойно) Доброе утро. Сегодня у нас важный день.\nМаша: (радостно) Я всё подготовила!",
  style:"classic", voices:{}, music:"none", musicPrompt:"", sfx:true,
  chars:[{name:"Алекс", voice:CONFIG.VOICES[0]},{name:"Маша", voice:CONFIG.VOICES[1]}],
  lib:[{name:"Детектив", voice:CONFIG.VOICES[2]},{name:"Рассказчик", voice:CONFIG.VOICES[4]}],
  projects:[
    {id:"a1f3", title:"Сцена в офисе",   status:"rendering", eta:now()+142, total:180, mode:"render"},
    {id:"b72c", title:"Знакомство",       status:"done",      mode:"render",  dur:"1:12", url:""},
    {id:"c90e", title:"Тест голоса",      status:"done",      mode:"preview", dur:"0:18", url:""}
  ],
  profile:{plan:"Студия Pro", until:"до 24 декабря", balance:1240, films:14}
};
const demo = !inTG;   // демо-данные только вне Telegram (в обычном браузере)

async function loadData(){
  if (demo) return;
  // внутри Telegram показываем только реальные данные клиента
  S.chars=[]; S.lib=[]; S.projects=[];
  S.profile={plan:"Без подписки", until:"", balance:0, films:0};
  S.script="";
  try{
    const r = await fetch("/api/me", {headers:{"X-Init-Data": tg.initData}});
    if(!r.ok) throw new Error("api "+r.status);
    const d = await r.json();
    isAdmin = !!d.admin;
    S.chars = d.characters.map(c=>({name:c.name, voice:c.voice||CONFIG.VOICES[0]}));

const $ = s => document.querySelector(s);
const ic = (n,c="") => `<svg class="ic ${c}"><use href="#${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2200) }
function fmt(sec){ sec=Math.max(0,sec|0); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0") }

function parseScript(text){
  const scenes=[]; let cur=null;
  for(const raw of text.split("\n")){
    const line=raw.trim(); if(!line) continue;
    let m=line.match(/^\[?\s*сцена\s*[:\-–]\s*(.+?)\]?$/i);
    if(m){ cur={setting:m[1],lines:[]}; scenes.push(cur); continue }
    m=line.match(/^([^:]{1,30}):\s*(?:\(([^)]*)\))?\s*(.+)$/);
    if(m){ if(!cur){cur={setting:"студия",lines:[]}; scenes.push(cur)} cur.lines.push({who:m[1].trim(),emotion:(m[2]||"neutral").trim(),text:m[3].trim()}) }
  }
  return scenes;
}
function analyse(){
  const sc=parseScript(S.script), lines=sc.flatMap(s=>s.lines);
  const words=lines.reduce((a,l)=>a+l.text.split(/\s+/).length,0);
  const dur=Math.round(words/2.6 + lines.length*0.4);
  const who=[...new Set(lines.map(l=>l.who))];
  const known=new Set([...S.chars,...S.lib].map(c=>c.name.toLowerCase()));
  return {scenes:sc.length, lines:lines.length, who, missing:who.filter(w=>!known.has(w.toLowerCase())), dur, cost:Math.max(1,Math.ceil(dur/60*CONFIG.PRICE_PER_MIN))};
}

  document.querySelectorAll("[data-eta]").forEach(c=>{
    const left=(+c.dataset.eta)-now(); c.querySelector("b").textContent=fmt(left);
    const bar=c.closest("[data-pid]").querySelector("[data-bar]"); const p=S.projects.find(p=>p.id===c.closest("[data-pid]").dataset.pid);
    if(bar&&p) bar.style.width=Math.min(98,Math.max(4,100-left/(p.total||180)*100))+"%";
  });
},1000);

loadData().then(draw); draw();
</script>
